<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>13115 Task Tracker has moved to Telemetry</title>
<style>
  body { margin: 0; background: #0E0E12; color: #F5F5F7; font-family: -apple-system, system-ui, sans-serif;
         display: grid; place-items: center; min-height: 100vh; padding: 24px 16px; box-sizing: border-box; }
  main { max-width: 480px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  p { color: #B4B4BE; line-height: 1.5; }
  a.button { display: inline-block; margin: 8px 4px; padding: 12px 20px; border-radius: 12px; background: #D61F3A;
             color: #fff; text-decoration: none; font-weight: 700; }
  a.quiet { background: transparent; border: 1px solid #3A3A44; }
</style>
</head>
<body>
<main>
  <h1>The 13115 Task Tracker has moved</h1>
  <p>Team 13115 now uses Telemetry. Your tasks, roles and subteams came with you: sign in with the same Google account.</p>
  <a class="button" href="https://apps.apple.com/us/app/telemetry-by-13115/id6830405761">Get Telemetry for iPhone</a>
  <a class="button quiet" href="/telemetry/">Use it on a computer</a>
</main>
<script>
  // Browsers that kept the old app offline: drop it so this page shows instead.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
  }
</script>
</body>
</html>
